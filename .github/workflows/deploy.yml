name: Deploy QuinSuper
on:
  push:
    branches: ['claude/cabas-scaffold']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quinsuper-production
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint -w app
      - run: npm run build:server
      - run: npm run export:web -w app
        env:
          EXPO_PUBLIC_API_URL: /api
      - name: Publish tested release for the server
        shell: bash
        run: |
          set -euo pipefail
          test -s app/dist/index.html
          mkdir -p /tmp/quinsuper-release/web /tmp/quinsuper-release/server
          cp -a app/dist/. /tmp/quinsuper-release/web/
          cp build/server/*.mjs /tmp/quinsuper-release/server/
          printf 'RELEASE_SHA=%s\n' "$GITHUB_SHA" > /tmp/quinsuper-release/release.env
          git fetch origin deploy/quinsuper || true
          if git show-ref --verify --quiet refs/remotes/origin/deploy/quinsuper; then
            git worktree add /tmp/quinsuper-publish -B deploy/quinsuper origin/deploy/quinsuper
          else
            mkdir /tmp/quinsuper-publish
            git -C /tmp/quinsuper-publish init -b deploy/quinsuper
            git -C /tmp/quinsuper-publish remote add origin "$(git remote get-url origin)"
          fi
          # Only generated release files belong on this branch; do not put databases or secrets here.
          find /tmp/quinsuper-publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/quinsuper-release/. /tmp/quinsuper-publish/
          git -C /tmp/quinsuper-publish config user.name github-actions[bot]
          git -C /tmp/quinsuper-publish config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/quinsuper-publish add .
          git -C /tmp/quinsuper-publish commit -m "Deploy $GITHUB_SHA"
          # The separate worktree uses checkout's authenticated repository configuration.
          auth_header=$(git config --get http.https://github.com/.extraheader)
          git -C /tmp/quinsuper-publish -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:refs/heads/deploy/quinsuper
      - name: Deployment details
        run: |
          echo 'Server checks the deployment branch every minute and performs its own API health check.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Site: https://quinsuper.trottedmedia.com' >> "$GITHUB_STEP_SUMMARY"
